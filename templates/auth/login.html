{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="cyber-card">
                <div class="cyber-card-header text-center justify-content-center flex-column py-4">
                    <div class="stat-icon purple mb-2" style="width: 58px; height: 58px;">
                        <i class="bi bi-shield-lock fs-3"></i>
                    </div>
                    <h4 class="text-white fw-bold mb-1">Security Clearance</h4>
                    <p class="text-secondary small mb-0">Sign in to your encrypted operational console</p>
                </div>
                <div class="cyber-card-body p-4">
                    <form method="POST" action="{{ url_for('login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                        <div class="mb-3">
                            <label for="username" class="form-label">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="agent_id or name@domain" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Access Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••••••" required>
                                <button class="btn btn-cyber-secondary btn-toggle-password" type="button" data-target="password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-cyber-primary w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right"></i> Authenticate & Enter
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Fill -->
                    <div class="pt-3 border-top border-secondary border-opacity-25 text-center">
                        <div class="small text-muted mb-2">Fast Fill Demo Credentials:</div>
                        <div class="d-flex justify-content-center gap-2">
                            <button type="button" class="btn btn-sm btn-cyber-outline" onclick="fillCreds('admin', 'Admin@123456')">
                                <i class="bi bi-shield-check"></i> Admin
                            </button>
                            <button type="button" class="btn btn-sm btn-cyber-outline" onclick="fillCreds('testuser', 'User@123456')">
                                <i class="bi bi-person"></i> User
                            </button>
                        </div>
                    </div>
                </div>
                <div class="p-3 text-center border-top border-secondary border-opacity-25 small" style="background: rgba(20, 31, 56, 0.3);">
                    Don't have an operational account? <a href="{{ url_for('register') }}" class="text-info fw-semibold text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function fillCreds(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}
</script>
{% endblock %}
