{% extends "base.html" %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="stat-icon red mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
        <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h1 class="display-4 fw-bold text-white mb-2">403</h1>
    <h4 class="text-danger mb-3">Security Access Forbidden</h4>
    <p class="text-secondary mb-4" style="max-width: 500px; margin: 0 auto;">
        Your operator credentials lack the required cryptographic privileges or administrative role to access this area.
    </p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-cyber-primary">
        <i class="bi bi-arrow-left"></i> Return to Operator Dashboard
    </a>
</div>
{% endblock %}
