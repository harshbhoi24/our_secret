{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="stat-icon red mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
        <i class="bi bi-geo-alt-fill"></i>
    </div>
    <h1 class="display-4 fw-bold text-white mb-2">404</h1>
    <h4 class="text-secondary mb-3">Resource Coordinate Not Found</h4>
    <p class="text-muted mb-4" style="max-width: 500px; margin: 0 auto;">
        The requested resource, file, or endpoint is inaccessible or has been purged from the matrix.
    </p>
    <a href="{{ url_for('dashboard') if current_user else url_for('index') }}" class="btn btn-cyber-primary">
        <i class="bi bi-arrow-left"></i> Return to Secure Perimeter
    </a>
</div>
{% endblock %}
